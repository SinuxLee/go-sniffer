name: Release MacOS Product

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Preinstall
        if: runner.os == 'Mac' || runner.os == 'macOS'
        run: |
          brew install libpcap
      
      - name: Build
        run: |
          export OS=$(go env GOOS)
          export ARCH=$(go env GOARCH)
          echo "OS=${OS}" >> $GITHUB_ENV
          echo "ARCH=${ARCH}" >> $GITHUB_ENV

          go build -o go-sniffer main.go
          tar -czf go-sniffer_${OS}_${ARCH}.tgz go-sniffer
          ls -hl

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            go-sniffer_${{ env.OS }}_${{ env.ARCH }}.tgz
