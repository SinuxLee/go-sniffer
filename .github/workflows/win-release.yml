name: Release Windows Product

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  goreleaser:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Preinstall
        if: runner.os == 'Windows'
        run: |
          choco install nmap zip -y

      - name: Build
        # default shell is powershell
        run: |
          $OS = & go env GOOS
          $ARCH = & go env GOARCH
          echo OS=$OS >> $GITHUB_ENV
          echo ARCH=$ARCH >> $GITHUB_ENV

          go build -o go-sniffer.exe main.go
          zip -r go-sniffer_$OS_$ARCH.zip go-sniffer.exe
          dir

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            go-sniffer_${{ env.OS }}_${{ env.ARCH }}.zip
