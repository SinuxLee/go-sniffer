name: Release Windows Product

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  goreleaser:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Preinstall
        if: runner.os == 'Windows'
        run: |
          choco install nmap zip -y

      - name: Build
        run: |
          for /f "usebackq delims=" %i in (`go env GOOS`) do set GOOS=%i
          for /f "usebackq delims=" %i in (`go env GOARCH`) do set GOARCH=%i
          echo GOOS=%GOOS% >> $GITHUB_ENV
          echo GOARCH=%GOARCH% >> $GITHUB_ENV

          go build -o go-sniffer.exe main.go
          zip -r go-sniffer_${{ env.GOOS }}_${{ env.GOARCH }}.zip go-sniffer.exe
          dir

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            go-sniffer_${{ env.GOOS }}_${{ env.GOARCH }}.zip
