name: Release Windows Product

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  goreleaser:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Preinstall
        if: runner.os == 'Windows'
        run: |
          choco install libpcap

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build
        run: |
          for /f "tokens=*" %%i in ('go env GOOS') do set OS=%%i
          for /f "tokens=*" %%i in ('go env GOARCH') do set ARCH=%%i
          go build -o go-sniffer.exe main.go
          zip -r go-sniffer_%OS%_%ARCH%.zip go-sniffer.exe
          dir

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            go-sniffer_%OS%_%ARCH%.zip
